name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (oxfmt)
        run: npm run format

      - name: Lint CSS (stylelint)
        run: npm run lint:css

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: npm ci

      - name: Build CSS (Tailwind)
        run: npm run build:css:minify

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola

      - name: Build site with Zola
        run: zola build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ github.event.pull_request.number }}
          path: public/
          retention-days: 7
