name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build site with Zola
        run: |
          docker run --rm \
            -v "$PWD:/site" -w /site \
            ghcr.io/getzola/zola:latest \
            build --base-url "https://www.feliciterra.com"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.event.pull_request.number }}
          path: public/
          retention-days: 7
