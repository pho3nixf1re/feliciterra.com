name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (oxfmt)
        run: npm run format

      - name: Lint CSS (stylelint)
        run: npm run lint:css

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola

      - name: Build site with Zola
        run: zola build --base-url "https://www.feliciterra.com"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.event.pull_request.number }}
          path: public/
          retention-days: 7
