name: Build and deploy to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build site with Zola
        run: |
          docker run --rm \
            -v "$PWD:/site" -w /site \
            ghcr.io/getzola/zola:latest \
            build --base-url "${{ vars.SITE_BASE_URL || 'https://www.feliciterra.com' }}"

      - name: Deploy to Garage S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws s3 sync public/ s3://${{ vars.S3_BUCKET }} \
            --endpoint-url https://s3.feliciterra.net \
            --region feliciterra \
            --delete
