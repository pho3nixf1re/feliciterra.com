services:
  site:
    image: ${SITE_IMAGE}
    ports:
      - "${SITE_PORT:-8080}:8080"
    restart: unless-stopped

  updater:
    image: docker:cli
    restart: unless-stopped
    working_dir: /app
    environment:
      POLL_INTERVAL: ${POLL_INTERVAL:-300}
      SITE_IMAGE: ${SITE_IMAGE}
      GHCR_USER: ${GHCR_USER}
      GHCR_TOKEN: ${GHCR_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./.env:/app/.env:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "$${GHCR_TOKEN}" | docker login ghcr.io -u "$${GHCR_USER}" --password-stdin
        while true; do
          docker compose pull site && docker compose up -d --no-deps site
          sleep "$${POLL_INTERVAL}"
        done
